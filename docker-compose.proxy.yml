services:
  app:
    build:
      context: .
      target: app
    image: genesis/app:prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      target: nginx
    image: genesis/nginx:prod
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
    networks:
      default:
      web-proxy:
        aliases:
          - genesis-nginx

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-genesis}
      POSTGRES_USER: ${DB_USERNAME:-genesis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    command: sh -c "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    volumes:
      - redis-data:/data

networks:
  web-proxy:
    external: true

volumes:
  app-storage:
  postgres-data:
  redis-data:
